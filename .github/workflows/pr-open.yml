name: Build Pull request
on:
  pull_request:
    types: [opened, synchronize, reopened]
env:
  NEXT_PUBLIC_TINA_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_TINA_CLIENT_ID }}
  TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
  NEXT_PUBLIC_TINA_BRANCH: ${{ github.head_ref }}
  # Run the Tina build against a local, file-based data layer so it works
  # without a MONGODB_URI / self-hosted datalayer (see database.ts). The live
  # demo is served by Vercel with its own env, so this only affects CI.
  TINA_PUBLIC_IS_LOCAL: "true"
jobs:
  build:
    runs-on: ubuntu-latest
    name: Build sample
    steps:
      - uses: actions/checkout@v5
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        id: pnpm-install
        with:
          version: 9.15.2
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      # Validate that the TinaCMS packages build the schema and regenerate the
      # client/types — the surface this repo changes. A full `next build` static
      # export can't run here: prerendering needs a live content backend
      # (TinaCloud creds or a persistent self-hosted datalayer), which CI does
      # not have — see tinacms/tina.io#4666. The full build + deploy is
      # validated on every PR by the Vercel preview.
      - name: Build (validate Tina schema + generated client)
        run: pnpm exec tinacms build

  # NOTE: the search-tests job was removed from the PR gate because it could
  # never pass here:
  #   1. Its base_url was wrong — the preview alias is
  #      `tina-docs-demo-git-<branch>-tinacms.vercel.app` (project is
  #      `tina-docs-demo`), and the branch slug must have `/` replaced with `-`.
  #   2. Preview deployments are behind Vercel Deployment Protection (every
  #      path 302s to vercel.com/sso-api), so an unauthenticated Playwright run
  #      can't reach the site.
  # To restore it: enable "Protection Bypass for Automation" in the Vercel
  # project, add VERCEL_AUTOMATION_BYPASS_SECRET to repo secrets, send it as the
  # `x-vercel-protection-bypass` header from Playwright, and re-add a job that
  # calls ./.github/workflows/search-test.yml with the corrected base_url. The
  # reusable workflow still runs via workflow_dispatch in the meantime.