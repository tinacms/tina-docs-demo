name: Build Pull request
on:
  pull_request:
    types: [opened, synchronize, reopened]
env:
  NEXT_PUBLIC_TINA_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_TINA_CLIENT_ID }}
  TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
  NEXT_PUBLIC_TINA_BRANCH: ${{ github.head_ref }}
  # Run the Tina build against a local, file-based data layer so it works
  # without a MONGODB_URI / self-hosted datalayer (see database.ts). The live
  # demo is served by Vercel with its own env, so this only affects CI.
  TINA_PUBLIC_IS_LOCAL: "true"
jobs:
  build:
    runs-on: ubuntu-latest
    name: Build sample
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        id: pnpm-install
        with:
          version: 9.15.2
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      # Validate that the TinaCMS packages build the schema and regenerate the
      # client/types — the surface this repo changes. A full `next build` static
      # export can't run here: prerendering needs a live content backend
      # (TinaCloud creds or a persistent self-hosted datalayer), which CI does
      # not have — see tinacms/tina.io#4666. The full build + deploy is
      # validated on every PR by the Vercel preview.
      - name: Build (validate Tina schema + generated client)
        run: pnpm exec tinacms build

  search-tests:
    needs: build
    uses: ./.github/workflows/search-test.yml
    with:
      base_url: https://tina-docs-git-${{ github.head_ref }}-tinacms.vercel.app